global:
  scrape_interval: 15s

scrape_configs:
  - job_name: users-api
    static_configs:
      - targets: ["users-api:8080"] # нейминг унифицирован на всём проекте! >:|
    metrics_path: /metrics

  - job_name: events-api
    static_configs:
      - targets: ["events-api:8080"]
    metrics_path: /metrics

  - job_name: bookings-api
    static_configs:
      - targets: ["bookings-api:8080"]
    metrics_path: /metrics
